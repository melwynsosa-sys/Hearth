<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corazón de Partículas 💙</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #020610;
      font-family: Arial, sans-serif;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #musicButton {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      padding: 12px 24px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 30px;

      background: rgba(10,20,50,0.65);
      backdrop-filter: blur(10px);

      color: white;
      font-size: 15px;
      cursor: pointer;

      box-shadow:
        0 0 15px rgba(80,150,255,0.5),
        inset 0 0 10px rgba(255,255,255,0.05);

      transition: 0.3s;
    }

    #musicButton:hover {
      transform: translateX(-50%) scale(1.05);
      box-shadow: 0 0 25px rgba(80,150,255,0.8);
    }

    #message {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);

      color: rgba(255,255,255,0.85);
      font-size: 18px;
      text-align: center;

      text-shadow: 0 0 10px #4da3ff;

      pointer-events: none;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>

<div id="canvas-container"></div>

<button id="musicButton">🎵 Activar música</button>

<div id="message">
  💙 Un corazón hecho de luz 💙
</div>

<audio id="music" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

const container = document.getElementById("canvas-container");


// ===============================
// ESCENA
// ===============================

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(
  0x020610,
  0.012
);


// ===============================
// CÁMARA
// ===============================

const camera = new THREE.PerspectiveCamera(
  60,
  container.clientWidth / container.clientHeight,
  0.1,
  1000
);

camera.position.set(0, 0, 34);


// ===============================
// RENDER
// ===============================

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

container.appendChild(renderer.domElement);


// ===============================
// CONTROLES
// ===============================

const controls = new THREE.OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.minDistance = 20;
controls.maxDistance = 55;


// ===============================
// TEXTURA DE LUZ
// ===============================

function createGlowTexture() {

  const canvas = document.createElement("canvas");

  canvas.width = 128;
  canvas.height = 128;

  const ctx = canvas.getContext("2d");

  const gradient = ctx.createRadialGradient(
    64,
    64,
    0,
    64,
    64,
    64
  );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,1)"
  );

  gradient.addColorStop(
    0.15,
    "rgba(170,220,255,1)"
  );

  gradient.addColorStop(
    0.4,
    "rgba(70,150,255,0.8)"
  );

  gradient.addColorStop(
    0.7,
    "rgba(30,80,255,0.25)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    128,
    128
  );

  const texture = new THREE.Texture(canvas);

  texture.needsUpdate = true;

  return texture;
}


const particleTexture = createGlowTexture();


// ===============================
// COLORES
// ===============================

const palette = [

  new THREE.Color("#1d4ed8"),
  new THREE.Color("#2563eb"),
  new THREE.Color("#3b82f6"),
  new THREE.Color("#60a5fa"),
  new THREE.Color("#93c5fd"),
  new THREE.Color("#bfdbfe"),
  new THREE.Color("#ffffff")

];


// =====================================================
// CORAZÓN
// =====================================================

const heartParticleCount = 20000;

const heartGeo =
  new THREE.BufferGeometry();

const heartPos =
  new Float32Array(
    heartParticleCount * 3
  );

const heartOrig =
  new Float32Array(
    heartParticleCount * 3
  );

const heartCols =
  new Float32Array(
    heartParticleCount * 3
  );

const speeds =
  new Float32Array(
    heartParticleCount
  );


// =====================================================
// GENERACIÓN DEL CORAZÓN RELLENO
// =====================================================

for (
  let i = 0;
  i < heartParticleCount;
  i++
) {

  /*
    Generamos muchos puntos dentro
    de la ecuación del corazón.
  */

  const t =
    Math.random() *
    Math.PI *
    2;

  /*
    Punto de la superficie
  */

  const surfaceX =
    16 *
    Math.pow(Math.sin(t), 3);

  const surfaceY =
    13 * Math.cos(t)
    - 5 * Math.cos(2 * t)
    - 2 * Math.cos(3 * t)
    - Math.cos(4 * t);


  /*
    Distribución radial.

    Al usar sqrt(random)
    conseguimos que el corazón
    quede MUCHO más lleno.
  */

  const fill =
    Math.sqrt(Math.random());


  let x =
    surfaceX *
    fill *
    0.65;

  let y =
    surfaceY *
    fill *
    0.65;


  /*
    Profundidad 3D
  */

  let z =
    (Math.random() - 0.5) *
    5.5 *
    fill;


  /*
    Pequeña irregularidad
    para que no parezca una
    figura completamente plana.
  */

  x += (Math.random() - 0.5) * 0.15;
  y += (Math.random() - 0.5) * 0.15;


  const index = i * 3;


  heartPos[index] = x;
  heartPos[index + 1] = y;
  heartPos[index + 2] = z;


  heartOrig[index] = x;
  heartOrig[index + 1] = y;
  heartOrig[index + 2] = z;


  speeds[i] =
    Math.random() * 1.5 + 0.5;


  /*
    Color aleatorio
  */

  const color =
    palette[
      Math.floor(
        Math.random() *
        palette.length
      )
    ];


  heartCols[index] =
    color.r;

  heartCols[index + 1] =
    color.g;

  heartCols[index + 2] =
    color.b;
}


heartGeo.setAttribute(
  "position",
  new THREE.BufferAttribute(
    heartPos,
    3
  )
);


heartGeo.setAttribute(
  "color",
  new THREE.BufferAttribute(
    heartCols,
    3
  )
);


// ===============================
// MATERIAL DEL CORAZÓN
// ===============================

const heartMat =
  new THREE.PointsMaterial({

    size: 0.62,

    map: particleTexture,

    vertexColors: true,

    transparent: true,

    opacity: 0.95,

    blending:
      THREE.AdditiveBlending,

    depthWrite: false

  });


const heartMesh =
  new THREE.Points(
    heartGeo,
    heartMat
  );


scene.add(heartMesh);


// =====================================================
// PARTÍCULAS ALREDEDOR
// =====================================================

const ambientCount = 2500;

const ambientGeo =
  new THREE.BufferGeometry();

const ambientPos =
  new Float32Array(
    ambientCount * 3
  );


for (
  let i = 0;
  i < ambientCount;
  i++
) {

  const index = i * 3;

  ambientPos[index] =
    (Math.random() - 0.5) * 55;

  ambientPos[index + 1] =
    (Math.random() - 0.5) * 40;

  ambientPos[index + 2] =
    (Math.random() - 0.5) * 30;

}


ambientGeo.setAttribute(
  "position",
  new THREE.BufferAttribute(
    ambientPos,
    3
  )
);


const ambientMat =
  new THREE.PointsMaterial({

    size: 0.18,

    map: particleTexture,

    color: 0x6aaeff,

    transparent: true,

    opacity: 0.6,

    blending:
      THREE.AdditiveBlending,

    depthWrite: false

  });


const ambientParticles =
  new THREE.Points(
    ambientGeo,
    ambientMat
  );


scene.add(
  ambientParticles
);


// =====================================================
// HALO DETRÁS DEL CORAZÓN
// =====================================================

const haloGeo =
  new THREE.RingGeometry(
    10,
    15,
    64
  );


const haloMat =
  new THREE.MeshBasicMaterial({

    color: 0x1677ff,

    transparent: true,

    opacity: 0.07,

    side: THREE.DoubleSide,

    blending:
      THREE.AdditiveBlending

  });


const halo =
  new THREE.Mesh(
    haloGeo,
    haloMat
  );


halo.position.z = -3;

scene.add(halo);


// =====================================================
// ANIMACIÓN
// =====================================================

const clock =
  new THREE.Clock();


function animate() {

  requestAnimationFrame(
    animate
  );


  const time =
    clock.getElapsedTime();


  // Rotación

  heartMesh.rotation.y =
    time * 0.22;


  ambientParticles.rotation.y =
    time * 0.015;


  halo.rotation.z =
    time * 0.15;


  // =============================
  // LATIDO
  // =============================

  const heartbeat =
    1
    + Math.sin(time * 3.5) * 0.035
    + Math.pow(
        Math.sin(time * 7),
        2
      ) * 0.025;


  heartMesh.scale.set(
    heartbeat,
    heartbeat,
    heartbeat
  );


  // =============================
  // MOVIMIENTO DE PARTÍCULAS
  // =============================

  const positions =
    heartGeo.attributes.position;


  for (
    let i = 0;
    i < heartParticleCount;
    i++
  ) {

    const index = i * 3;

    const speed =
      speeds[i];


    positions.array[index] =

      heartOrig[index]
      +
      Math.sin(
        time * speed + i
      ) * 0.08;


    positions.array[index + 1] =

      heartOrig[index + 1]
      +
      Math.cos(
        time * speed + i
      ) * 0.08;


    positions.array[index + 2] =

      heartOrig[index + 2]
      +
      Math.sin(
        time * speed * 0.5 + i
      ) * 0.08;

  }


  positions.needsUpdate =
    true;


  // =============================
  // AMBIENTE
  // =============================

  ambientParticles.rotation.x =
    Math.sin(time * 0.1) * 0.1;


  controls.update();

  renderer.render(
    scene,
    camera
  );

}


animate();


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      container.clientWidth /
      container.clientHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
      container.clientWidth,
      container.clientHeight
    );

  }
);


// =====================================================
// MÚSICA
// =====================================================

const music =
  document.getElementById(
    "music"
  );

const musicButton =
  document.getElementById(
    "musicButton"
  );


musicButton.addEventListener(
  "click",
  () => {

    if (
      music.paused
    ) {

      music.play();

      musicButton.textContent =
        "🔊 Música activada";

    } else {

      music.pause();

      musicButton.textContent =
        "🎵 Activar música";

    }

  }
);

</script>

</body>
</html>
